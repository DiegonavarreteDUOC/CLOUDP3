# ==========================================
# MINI PEDIDOS - CONFIGURACION GENERAL
# ==========================================
spring:
  application:
    name: mini-pedidos

  # ==========================================
  # RABBITMQ - CONEXION
  # ==========================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual

  # ==========================================
  # KAFKA - CONEXION Y PROPIEDADES (CLUSTERING 3 BROKERS)
  # ==========================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: record

# ==========================================
# KAFKA - TOPICOS Y GRUPOS DE CONSUMIDORES
# ==========================================
kafka:
  topics:
    pedidos-eventos: pedidos.eventos
    pedidos-metricas: pedidos.metricas
    pedidos-dlt: pedidos.eventos.DLT
  consumer-groups:
    analitica: grupo-analitica-ventas
    auditoria: grupo-auditoria-tiempo-real
    metricas: grupo-metricas-stream

# ==========================================
# SQS / ELASTICMQ
# ==========================================
sqs:
  endpoint: ${SQS_ENDPOINT:http://localhost:9324}
  queue-url: ${SQS_QUEUE_URL:http://localhost:9324/000000000000/pedidos-mini}

# ==========================================
# RABBITMQ - NOMBRES DE COLAS, EXCHANGES Y BINDINGS
# (Configuracion centralizada - Indicador 1 EP3)
# ==========================================
rabbitmq:
  queues:
    pedidos: pedidos
    notificaciones: notificaciones
    reportes: reportes
    pedidos-dlq: pedidos.dlq
    notificaciones-dlq: notificaciones.dlq
    reportes-dlq: reportes.dlq

  exchanges:
    pedidos-direct: pedidos.direct
    pedidos-topic: pedidos.topic
    pedidos-dlx: pedidos.dlx
    notificaciones-dlx: notificaciones.dlx
    reportes-dlx: reportes.dlx

  bindings:
    pedidos-routing-key: pedidos.crear
    notificaciones-routing-key: notificaciones.enviar
    reportes-routing-key: reportes.generar
    pedidos-dlq-routing-key: pedidos.error
    notificaciones-dlq-routing-key: notificaciones.error
    reportes-dlq-routing-key: reportes.error

server:
  port: 8080
